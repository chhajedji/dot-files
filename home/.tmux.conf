set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -s escape-time 0
set -g history-limit 1000000

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy on mouse drag-end but stay in copy-mode (don't scroll to bottom).
# copy-pipe-no-clear also pushes the selection to the system clipboard via copy-command (set below).
bind -T copy-mode        MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi     MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# --- Cross-platform system clipboard (macOS + WSL) ---
# Single source of truth = the OS clipboard: copy syncs to it, prefix-] pastes from it.
setw -g mode-keys vi
set  -g set-clipboard on

# macOS: pbcopy / pbpaste
if-shell 'uname | grep -q Darwin' {
    set -g copy-command 'pbcopy'
    bind ] run-shell 'tmux set-buffer -- "$(pbpaste)" && tmux paste-buffer -p'
}

# WSL: Windows clip.exe (copy) + PowerShell Get-Clipboard (paste).
# Absolute paths because the Windows PATH is not appended to the WSL PATH here.
if-shell 'grep -qi microsoft /proc/version 2>/dev/null' {
    set -g copy-command '/mnt/c/Windows/System32/clip.exe'
    bind ] run-shell 'tmux set-buffer -- "$(/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard | tr -d "\r")" && tmux paste-buffer -p'
}

set-window-option -g window-status-current-style bg=#FF0000
